name: Frontend CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm install --global npm@11.8.0 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Angular tests and production build
        run: |
          npm test
          npm run build -- --configuration production
      - name: Build production frontend image without backend credentials
        run: docker build --tag policy-investigator-frontend:ci .

  request-ci:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ThierryTe/ai-policy-invetigator-frontend'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Trigger coordinated CI in the backend repository
        env:
          # Existing dispatch credential: backend Contents write only, never GHCR.
          GH_TOKEN: ${{ secrets.BACKEND_CI_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure BACKEND_CI_TOKEN with Contents write access to ThierryTe/ai-policy-invetigator for repository_dispatch.'
            exit 1
          fi
          gh api --method POST repos/ThierryTe/ai-policy-invetigator/dispatches -f event_type=frontend-main
