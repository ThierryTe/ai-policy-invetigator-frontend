name: Frontend CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm install --global npm@11.8.0 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Angular tests and production build
        run: |
          npm test
          npm run build -- --configuration production
      - name: Build production frontend image without backend credentials
        run: docker build --tag policy-investigator-frontend:ci .

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ThierryTe/ai-policy-invetigator-frontend'
    permissions:
      contents: read
      packages: write
    uses: ThierryTe/ai-policy-invetigator/.github/workflows/publish-images.yml@main
    with:
      component: frontend

  deploy:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ThierryTe/ai-policy-invetigator/.github/workflows/deploy-production.yml@main
    with:
      component: frontend
      source_sha: ${{ github.sha }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
